name: Build ToadIQ

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained app
        run: dotnet publish src/Moveiq.App/Moveiq.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/ToadIQ-win-x64

      - name: Install WiX Toolset
        run: dotnet tool install wix --tool-path .tools/wix --version 6.0.2

      - name: Build Windows MSI installer
        run: '& ".tools\wix\wix.exe" build installer\ToadIQ.wxs -o artifacts\installer\ToadIQ-Setup-1.0.0-win-x64.msi'
        shell: pwsh

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ToadIQ-Installer-win-x64
          path: artifacts/installer/ToadIQ-Setup-1.0.0-win-x64.msi
